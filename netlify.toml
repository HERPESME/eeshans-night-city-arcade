# Send visitors (and search engines) from the default Netlify subdomain to the
# custom domain so only one URL gets indexed.
[[redirects]]
  from = "https://eeshanportfolio.netlify.app/*"
  to = "https://technightcity.com/:splat"
  status = 301
  force = true

[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "https://www.technightcity.com/*"
  to = "https://technightcity.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/profile"
  to = "/profile/index.html"
  status = 200

[[redirects]]
  from = "/projects"
  to = "/projects/index.html"
  status = 200

[[redirects]]
  from = "/terminal"
  to = "/terminal/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
