# Send visitors (and search engines) from the default Netlify subdomain to the
# custom domain so only one URL gets indexed.
[[redirects]]
  from = "https://eeshanportfolio.netlify.app/*"
  to = "https://technightcity.com/:splat"
  status = 301
  force = true

[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "https://www.technightcity.com/*"
  to = "https://technightcity.com/:splat"
  status = 301
  force = true

[functions]
  node_bundler = "esbuild"

[functions.render]
  included_files = [".ssr/template.html"]

[[redirects]]
  from = "/"
  to = "/.netlify/functions/render"
  status = 200
  force = true

[[redirects]]
  from = "/profile"
  to = "/.netlify/functions/render"
  status = 200
  force = true

[[redirects]]
  from = "/profile/"
  to = "/.netlify/functions/render"
  status = 200
  force = true

[[redirects]]
  from = "/projects"
  to = "/.netlify/functions/render"
  status = 200
  force = true

[[redirects]]
  from = "/projects/"
  to = "/.netlify/functions/render"
  status = 200
  force = true

[[redirects]]
  from = "/terminal"
  to = "/.netlify/functions/render"
  status = 200
  force = true

[[redirects]]
  from = "/terminal/"
  to = "/.netlify/functions/render"
  status = 200
  force = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
