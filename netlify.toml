# Upgrade legacy HTTP www requests directly to the canonical HTTPS hostname.
[[redirects]]
  from = "http://www.technightcity.com/*"
  to = "https://technightcity.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://eeshanportfolio.netlify.app/profile/"
  to = "https://technightcity.com/profile"
  status = 301
  force = true

[[redirects]]
  from = "https://eeshanportfolio.netlify.app/projects/"
  to = "https://technightcity.com/projects"
  status = 301
  force = true

[[redirects]]
  from = "https://eeshanportfolio.netlify.app/terminal/"
  to = "https://technightcity.com/terminal"
  status = 301
  force = true

[[redirects]]
  from = "https://www.technightcity.com/profile/"
  to = "https://technightcity.com/profile"
  status = 301
  force = true

[[redirects]]
  from = "https://www.technightcity.com/projects/"
  to = "https://technightcity.com/projects"
  status = 301
  force = true

[[redirects]]
  from = "https://www.technightcity.com/terminal/"
  to = "https://technightcity.com/terminal"
  status = 301
  force = true

# Send visitors (and search engines) from the default Netlify subdomain to the
# custom domain so only one URL gets indexed.
[[redirects]]
  from = "https://eeshanportfolio.netlify.app/*"
  to = "https://technightcity.com/:splat"
  status = 301
  force = true

[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "https://www.technightcity.com/*"
  to = "https://technightcity.com/:splat"
  status = 301
  force = true

[functions]
  node_bundler = "esbuild"

[functions.render]
  included_files = [".ssr/template.html"]

# The homepage serves the same server-rendered HTML prerendered into dist/index.html.

[[redirects]]
  from = "/profile"
  to = "/.netlify/functions/render"
  status = 200
  force = true

[[redirects]]
  from = "/profile/"
  to = "/.netlify/functions/render"
  status = 200
  force = true

[[redirects]]
  from = "/projects"
  to = "/.netlify/functions/render"
  status = 200
  force = true

[[redirects]]
  from = "/projects/"
  to = "/.netlify/functions/render"
  status = 200
  force = true

[[redirects]]
  from = "/terminal"
  to = "/.netlify/functions/render"
  status = 200
  force = true

[[redirects]]
  from = "/terminal/"
  to = "/.netlify/functions/render"
  status = 200
  force = true

# Preserve image links in cached HTML from the original deployment.
# Static media lives outside the forced /blogs/* page renderer.
[[redirects]]
  from = "/blogs/images/ultrafit-dashboard-original.png"
  to = "/blog-images/ultrafit-dashboard-screen.webp"
  status = 301
  force = true

[[redirects]]
  from = "/blogs/images/ultrafit-metrics-original.jpg"
  to = "/blog-images/ultrafit-metrics-screen.webp"
  status = 301
  force = true

[[redirects]]
  from = "/blogs/images/*"
  to = "/blog-images/:splat"
  status = 301
  force = true

# Blog pages use the shared renderer; unknown slugs remain real 404s.
[[redirects]]
  from = "/blogs"
  to = "/.netlify/functions/render"
  status = 200
  force = true

[[redirects]]
  from = "/blogs/*"
  to = "/.netlify/functions/render"
  status = 200
  force = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/blog-images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# Function-rendered HTML supplies these headers in render.mjs.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy-Report-Only = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://checkout.razorpay.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googleapis.com https://*.razorpay.com; frame-src https://*.razorpay.com; font-src 'self' data:; media-src 'self' blob:"
